name: Desktop Release

on:
  workflow_dispatch:
    inputs:
      channel:
        description: "Release channel"
        required: true
        default: "stable"
        type: choice
        options:
          - stable
          - beta
          - nightly
      edition:
        description: "Desktop edition"
        required: true
        default: "standard"
        type: choice
        options:
          - standard
          - performance
      create_release:
        description: "Publish as GitHub Release"
        required: false
        default: true
        type: boolean
  push:
    tags: ["desktop-v*"]

permissions:
  contents: write

jobs:
  package:
    runs-on: windows-latest
    env:
      DSP_RELEASE_CHANNEL: ${{ inputs.channel || 'stable' }}
      DSP_DESKTOP_API_BASE_URL: https://dsponline.cn/api
      DSP_UPDATE_BASE_URL: https://dsponline.cn/downloads/desktop
      CARGO_BUILD_JOBS: "2"
      CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}
    steps:
      - name: Check out source code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build native host sidecar
        run: npm run native:build-host

      - name: Build Desktop Application
        id: build_desktop
        shell: pwsh
        run: |
          $hasSigning = [bool]($env:CSC_LINK -and $env:CSC_KEY_PASSWORD)
          $edition = "${{ inputs.edition || 'standard' }}"
          Write-Host "Signing credentials present: $hasSigning"
          Write-Host "Target edition: $edition"

          if ($hasSigning -and $edition -eq 'standard') {
            Write-Host "Executing signed production desktop:release..."
            npm run desktop:release
            $relative = node desktop/select-desktop-release-output.cjs
            if ($LASTEXITCODE -ne 0) { throw "Expected exactly one complete desktop release output" }
            $targetDir = $relative
          } else {
            if ($hasSigning) {
              Write-Host "Performance edition does not use formal release channel signing. Running dist mode."
            } else {
              Write-Host "No Windows code signing certificate found. Running unsigned dist mode."
            }
            if ($edition -eq 'performance') {
              npm run desktop:performance:dist
              $targetDir = if (Test-Path 'release-performance-edition') { 'release-performance-edition' } else { 'release-performance-edition-fallback' }
            } else {
              npm run desktop:dist
              $targetDir = if (Test-Path 'release') { 'release' } else { 'release-fallback' }
            }
          }

          Write-Host "Resolved output directory: $targetDir"
          "DSP_DESKTOP_RELEASE_OUTPUT=$targetDir" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Create Portable Zip
        shell: pwsh
        run: |
          $targetDir = "$env:DSP_DESKTOP_RELEASE_OUTPUT"
          $unpacked = Join-Path $targetDir "win-unpacked"
          if (Test-Path $unpacked) {
            $edition = "${{ inputs.edition || 'standard' }}"
            $pkg = Get-Content "package.json" | ConvertFrom-Json
            $version = $pkg.version
            $nameSuffix = if ($edition -eq 'performance') { "performance-portable" } else { "portable" }
            $zipName = "dsp-idle-$version-win-x64-$nameSuffix.zip"
            $zipPath = Join-Path $targetDir $zipName
            Write-Host "Compressing portable build to $zipPath..."
            Compress-Archive -Path "$unpacked\*" -DestinationPath $zipPath -CompressionLevel Optimal
            Write-Host "Created portable archive: $zipPath"
          }

      - name: Upload Desktop Artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dsp-idle-${{ inputs.edition || 'standard' }}-${{ env.DSP_RELEASE_CHANNEL }}
          if-no-files-found: warn
          path: |
            ${{ env.DSP_DESKTOP_RELEASE_OUTPUT }}/*.exe
            ${{ env.DSP_DESKTOP_RELEASE_OUTPUT }}/*.zip
            ${{ env.DSP_DESKTOP_RELEASE_OUTPUT }}/*.blockmap
            ${{ env.DSP_DESKTOP_RELEASE_OUTPUT }}/latest.yml
            ${{ env.DSP_DESKTOP_RELEASE_OUTPUT }}/desktop-build-evidence.json
            ${{ env.DSP_DESKTOP_RELEASE_OUTPUT }}/update-feed/**

      - name: Publish GitHub Release
        if: ${{ inputs.create_release != false || startsWith(github.ref, 'refs/tags/desktop-v') }}
        uses: softprops/action-gh-release@c062e08bd532815e2082a85e87e3ef29c3e6d191
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('desktop-v1.3.0-build{0}', github.run_number) }}
          name: DSP Idle Desktop 1.3.0 (${{ env.DSP_RELEASE_CHANNEL }})
          draft: false
          prerelease: ${{ (inputs.channel || 'stable') != 'stable' }}
          files: |
            ${{ env.DSP_DESKTOP_RELEASE_OUTPUT }}/*.exe
            ${{ env.DSP_DESKTOP_RELEASE_OUTPUT }}/*.zip
            ${{ env.DSP_DESKTOP_RELEASE_OUTPUT }}/*.blockmap
